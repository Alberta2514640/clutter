name: Website image

# Builds the website's image on every pull request and push to main, so a change that breaks the
# Dockerfile or the build fails here first. It pushes nothing: the image bakes in the cloud's
# addresses, so the cloud's image is built and pushed to ECR by npm run deploy -- prod --site-image
# (docs/architecture/environments.md § Credentials day). The values below are stand-ins.
on:
  pull_request:
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the website's image (no push)
        env:
          IMAGE_TAG: ci
          NEXT_PUBLIC_API_ENDPOINT: https://api.clutter.invalid
          NEXT_PUBLIC_ADAPTER_API_ENDPOINT: https://app.clutter.invalid
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: 000000000000-ci.apps.googleusercontent.com
          NEXT_PUBLIC_CONTACT_EMAIL: hello@clutter.invalid
        run: frontend/build-image.sh
