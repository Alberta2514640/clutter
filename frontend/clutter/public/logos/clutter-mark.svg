<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Clutter">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- three isometric blocks: two side by side below, one on top -->
  <g stroke="#0b1220" stroke-width="1.2" stroke-linejoin="round">
    <!-- lower left block -->
    <path d="M6 34 L19 26.5 L32 34 L19 41.5 Z" fill="url(#top)"/>
    <path d="M6 34 L19 41.5 L19 56 L6 48.5 Z" fill="url(#left)"/>
    <path d="M19 41.5 L32 34 L32 48.5 L19 56 Z" fill="url(#right)"/>
    <!-- lower right block -->
    <path d="M32 34 L45 26.5 L58 34 L45 41.5 Z" fill="url(#top)"/>
    <path d="M32 34 L45 41.5 L45 56 L32 48.5 Z" fill="url(#left)"/>
    <path d="M45 41.5 L58 34 L58 48.5 L45 56 Z" fill="url(#right)"/>
    <!-- top block -->
    <path d="M19 19 L32 11.5 L45 19 L32 26.5 Z" fill="url(#top)"/>
    <path d="M19 19 L32 26.5 L32 41 L19 33.5 Z" fill="url(#left)"/>
    <path d="M32 26.5 L45 19 L45 33.5 L32 41 Z" fill="url(#right)"/>
  </g>
</svg>
